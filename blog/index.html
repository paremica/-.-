<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Dinorah Ramírez</title>
<meta name="description" content="Poemas e historias fantásticas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:ital,opsz,wght@0,12..96,200..800;1,12..96,200..800&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:    #121110;
    --ink:   #f3f1ec;
    --blue:  #3a8db0;
    --muted: rgba(243,241,236,0.55);
    --rule:  rgba(243,241,236,0.14);
    --soft:  rgba(243,241,236,0.05);
    --max-w: 720px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Masthead ---------- */

  header.masthead {
    padding: 72px 24px 44px;
    border-bottom: 1px solid var(--rule);
  }

  .masthead-inner {
    max-width: var(--max-w);
    margin: 0 auto;
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.45;
    margin-bottom: 28px;
    transition: opacity 0.25s;
  }
  .back-home:hover { opacity: 0.85; }

  .masthead-eyebrow {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.64rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 22px;
  }
  .masthead-eyebrow .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.65;
    flex-shrink: 0;
  }

  h1.title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.8rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
  }

  .masthead-sub {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    color: var(--muted);
    margin: 18px 0 0;
    max-width: 46ch;
    line-height: 1.8;
  }

  /* ---------- Post list ---------- */

  main { padding: 8px 0 80px; }

  ul.post-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.post-row {
    border-bottom: 1px solid var(--rule);
  }
  li.post-row:first-child { border-top: 1px solid var(--rule); }

  a.post-row-link {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 20px;
    align-items: start;
    padding: 32px 24px;
    text-decoration: none;
    transition: background 0.2s ease;
  }

  a.post-row-link:hover,
  a.post-row-link:focus-visible {
    background: var(--soft);
  }

  a.post-row-link:focus-visible {
    outline: 1px solid var(--rule);
    outline-offset: -1px;
  }

  .post-index {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 300;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding-top: 3px;
  }

  .post-meta {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.64rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--blue);
    opacity: 0.8;
    margin: 0 0 10px;
  }

  h2.post-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 500;
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    margin: 0 0 10px;
    line-height: 1.25;
    color: var(--ink);
  }

  p.post-excerpt {
    margin: 0;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.85;
    max-width: 60ch;
  }

  /* ---------- Loading / error / empty ---------- */

  .state-msg {
    padding: 60px 24px;
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .state-msg a { color: var(--blue); }

  /* ---------- Post detail view ---------- */

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    opacity: 0.5;
    padding: 24px;
    border-bottom: 1px solid var(--rule);
    width: 100%;
    transition: opacity 0.25s;
  }

  .back-link:hover { opacity: 0.9; }

  .post-band {
    padding: 56px 24px 36px;
  }

  .post-band-inner {
    max-width: var(--max-w);
    margin: 0 auto;
  }

  .post-band .post-meta { opacity: 0.8; }

  h1.post-detail-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 6vw, 2.9rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 10px 0 0;
    color: var(--ink);
  }

  article.post-body {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 24px 100px;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    line-height: 1.9;
    color: var(--ink);
  }

  article.post-body img {
    max-width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--rule);
    margin: 12px 0;
  }

  article.post-body a { color: var(--blue); text-decoration-thickness: 1px; }

  article.post-body blockquote {
    margin: 28px 0;
    padding: 4px 0 4px 20px;
    border-left: 2px solid var(--blue);
    color: var(--muted);
    font-style: italic;
  }

  .source-link {
    display: inline-block;
    margin-top: 20px;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.45;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    text-decoration: none;
    transition: opacity 0.25s;
  }
  .source-link:hover { opacity: 0.85; }

  footer {
    padding: 40px 24px 56px;
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    border-top: 1px solid var(--rule);
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    a.post-row-link { grid-template-columns: 40px 1fr; gap: 14px; padding: 24px 20px; }
    header.masthead { padding: 56px 20px 32px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="back-home" href="../index.html#creative">← Volver al portafolio</a>
    <p class="masthead-eyebrow"><span class="dot"></span>Poemas e historiaz fantazticaz</p>
    <h1 class="title">Blog</h1>
    <p class="masthead-sub">Un cuaderno digital de poemas e historias fantásticas, leído directo desde el blog original.</p>
  </div>
</header>

<main id="app">
  <div class="state-msg">Cargando publicaciones…</div>
</main>

<footer>Publicado originalmente en Blogger — actualizado en vivo</footer>

<script>
  // ---------- Configuración ----------

  var API_KEY = "AIzaSyCerlNYSEs_-4E73yGAaS6ICgDmrUnHG-Q";
  var BLOG_ID = "8992071560697129445";
  var BASE_URL = "https://www.googleapis.com/blogger/v3";

  var app = document.getElementById("app");
  var postsCache = null;

  function stripHtml(html) {
    var div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent || div.innerText || "";
  }

  function excerpt(html, len) {
    var text = stripHtml(html).replace(/\s+/g, " ").trim();
    if (text.length <= len) return text;
    return text.slice(0, len).trim() + "…";
  }

  function formatDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
  }

  function readingTime(html) {
    var words = stripHtml(html).trim().split(/\s+/).length;
    var mins = Math.max(1, Math.round(words / 200));
    return mins + " min de lectura";
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, "&quot;");
  }

  async function fetchAllPosts() {
    if (postsCache) return postsCache;
    var items = [];
    var pageToken = null;
    do {
      var url = BASE_URL + "/blogs/" + BLOG_ID + "/posts?key=" + API_KEY +
        "&maxResults=500&fetchBodies=true&status=live" +
        (pageToken ? "&pageToken=" + pageToken : "");
      var resp = await fetch(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      var data = await resp.json();
      items = items.concat(data.items || []);
      pageToken = data.nextPageToken;
    } while (pageToken);
    postsCache = items;
    return items;
  }

  function renderList(posts) {
    if (!posts.length) {
      app.innerHTML = '<div class="state-msg">Todavía no hay publicaciones.</div>';
      return;
    }

    var rows = posts.map(function (post, i) {
      var num = String(i + 1).padStart(2, "0");
      return (
        '<li class="post-row">' +
          '<a class="post-row-link" href="#/post/' + post.id + '">' +
            '<span class="post-index">' + num + '</span>' +
            '<span>' +
              '<p class="post-meta">' + formatDate(post.published) + ' · ' + readingTime(post.content) + '</p>' +
              '<h2 class="post-title">' + post.title + '</h2>' +
              '<p class="post-excerpt">' + excerpt(post.content, 140) + '</p>' +
            '</span>' +
          '</a>' +
        '</li>'
      );
    }).join("");

    app.innerHTML = '<ul class="post-list">' + rows + '</ul>';
  }

  function renderPost(post) {
    app.innerHTML =
      '<a class="back-link" href="#/">&larr; volver a todas las historias</a>' +
      '<div class="post-band">' +
        '<div class="post-band-inner">' +
          '<p class="post-meta">' + formatDate(post.published) + ' · ' + readingTime(post.content) + '</p>' +
          '<h1 class="post-detail-title">' + post.title + '</h1>' +
        '</div>' +
      '</div>' +
      '<article class="post-body">' + post.content +
        '<div><a class="source-link" href="' + post.url + '" target="_blank" rel="noopener">ver publicación original en blogger &#8599;</a></div>' +
      '</article>';
    window.scrollTo(0, 0);
  }

  async function route() {
    var hash = window.location.hash;
    var match = hash.match(/^#\/post\/(.+)$/);

    try {
      var posts = await fetchAllPosts();

      if (match) {
        var id = match[1];
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) {
          app.innerHTML = '<div class="state-msg">No se encontró esa publicación. <a href="#/">volver</a></div>';
          return;
        }
        renderPost(post);
      } else {
        renderList(posts);
      }
    } catch (err) {
      app.innerHTML = '<div class="state-msg">No se pudieron cargar las publicaciones.<br>Revisa que la API Key sea correcta.<br><small>' + err.message + '</small></div>';
    }
  }

  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);
</script>

</body>
</html>
